<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사 효능감 및 전문성 학습 자기진단 | 장흥초등학교 2026</title>
<style>
:root {
  --color-background-primary:#ffffff; --color-background-secondary:#f5f5f4;
  --color-background-tertiary:#efede8; --color-background-info:#e6f1fb;
  --color-background-success:#eaf3de; --color-background-warning:#faeeda;
  --color-background-danger:#fcebeb;
  --color-text-primary:#1a1a18; --color-text-secondary:#5f5e5a;
  --color-text-info:#185fa5; --color-text-success:#3b6d11;
  --color-text-warning:#854f0b; --color-text-danger:#a32d2d;
  --color-border-tertiary:rgba(0,0,0,0.12); --color-border-secondary:rgba(0,0,0,0.22);
  --color-border-info:#378add; --color-border-success:#639922;
  --color-border-warning:#ba7517;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --color-background-primary:#1e1e1c; --color-background-secondary:#2a2a27;
  --color-background-tertiary:#333330; --color-background-info:#0c447c;
  --color-background-success:#27500a; --color-background-warning:#633806;
  --color-background-danger:#791f1f;
  --color-text-primary:#f0ede8; --color-text-secondary:#b4b2a9;
  --color-text-info:#85b7eb; --color-text-success:#c0dd97;
  --color-text-warning:#fac775; --color-text-danger:#f09595;
  --color-border-tertiary:rgba(255,255,255,0.12); --color-border-secondary:rgba(255,255,255,0.22);
  --color-border-info:#85b7eb; --color-border-success:#c0dd97; --color-border-warning:#fac775;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-background-tertiary);min-height:100vh;padding:1.5rem 1rem 5rem;color:var(--color-text-primary)}
input,select,textarea,button{font-family:var(--font-sans)}
</style>
</head>
<body>
<div id="root"></div>

<!-- ✅ 여기에 Apps Script 배포 URL을 붙여넣으세요 -->
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9siZMT_K17ghW71OM5TeR_QBE5W8Z8Gus4L8jwtmdH2zj3Iw55yiWKagW3tjysxrL9A/exec";
// 예시: "https://script.google.com/macros/s/AKfycb.../exec"
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect}=React;
const e=React.createElement;

// ── 설문 데이터 ──────────────────────────────────────────────────────────
const SA={id:"A",title:"교수 활동 전반 효능감",sub:"TALIS 2024 TQ_27 기반",inst:"아래 각 항목에 대해 현재 자신이 어느 정도 할 수 있는지 솔직하게 응답해 주세요.",scale:["전혀\n할 수 없음","어느 정도\n할 수 있음","상당히\n잘할 수 있음","아주 많이\n잘할 수 있음"],col:"info",items:["나는 학생들이 어려운 과제를 해결하도록 다양한 방법으로 도울 수 있다.","나는 학생들에게 수업 내용에 대한 대안적인 설명을 제공할 수 있다.","나는 수업을 방해하는 학생들을 적절히 지도하여 수업 흐름을 유지할 수 있다.","나는 학생들이 비판적으로 사고하도록 돕는 질문을 만들어 낼 수 있다.","나는 학생들이 수업에 가치를 부여하도록 동기를 부여할 수 있다.","나는 다양한 학생 수준에 맞게 수업을 조정하는 능력이 있다.","나는 어려운 학생들을 이해하도록 돕는 좋은 전략을 알고 있다.","나는 학생들이 나의 수업 기대치를 명확히 이해하도록 할 수 있다.","나는 학급에서 방해가 되는 행동을 미리 예방하거나 최소화할 수 있다.","나는 학생들이 학습에 적극적으로 참여하도록 유도할 수 있다.","나는 수업 목표를 달성할 수 있는 다양한 교수 방법을 구사할 수 있다.","나는 학생들이 학습한 내용을 일상생활과 연결하도록 도울 수 있다.","나는 학교 정책과 학생의 요구 사이에 균형을 유지할 수 있다.","나는 어려운 학생들을 위해 적절한 도전 활동을 제공할 수 있다.","나는 학생들이 수업 중 자신의 이해 정도를 점검하도록 도울 수 있다.","나는 학생들의 개별적인 학습 필요를 수업에서 적절히 반영할 수 있다.","나는 모든 학생이 성장하도록 도울 수 있다.","나는 학생들 간의 성취 격차를 줄이도록 지원할 수 있다."]};
const SB={id:"B",title:"정서 지원 효능감",sub:"TALIS 2024 TQ_61·62 기반",inst:"아래 각 항목에 대해 현재 자신이 어느 정도 할 수 있는지 솔직하게 응답해 주세요.",scale:["전혀\n할 수 없음","어느 정도\n할 수 있음","상당히\n잘할 수 있음","아주 많이\n잘할 수 있음"],col:"success",items:["나는 학생들이 정서적 어려움을 겪을 때 적절히 지원할 수 있다.","나는 학생들이 학교생활에서 소속감을 느끼도록 도울 수 있다.","나는 학생 간 갈등이 발생했을 때 효과적으로 중재할 수 있다.","나는 학생들의 사회적·정서적 발달에 긍정적인 영향을 미칠 수 있다.","나는 학급 내 심리적으로 안전한 분위기를 형성할 수 있다."]};
const SC={id:"C",title:"전문성 학습 필요 영역 자기진단",sub:"TALIS 2024 TQ_24 기반",inst:"아래 각 영역에 대해 현재 본인에게 어느 정도의 전문성 학습이 필요한지 표시해 주세요.",scale:["현재\n필요 없음","약간\n필요함","어느 정도\n필요함","매우 많이\n필요함"],col:"warning",items:["학생 평가의 실제 (과정 중심 평가, 형성평가 등)","개별화 학습 방법 (수준별 수업, 학생 맞춤 지원 등)","학생의 사회정서적 학습 지원 방법","학급에서의 학생 행동 관리 및 생활지도","학생 평가 결과의 분석 및 수업 개선 연계","디지털 도구와 자료를 활용한 교수법","교수학습 활동에서의 인공지능(AI) 활용","교사와 학부모(보호자) 간 협력 방법"]};
const SD={id:"D",title:"전문성 학습 참여 방해 요인",sub:"TALIS 2024 TQ_25 기반",inst:"아래 각 항목이 선생님의 전문성 학습 참여에 방해가 된다고 생각하시는지 표시해 주세요.",scale:["전혀\n동의 안 함","동의\n안 함","동의함","매우\n동의함"],col:"danger",items:["비용이 너무 많이 든다.","학교 차원의 지원이 부족하다.","전문성 학습 활동과 업무 일정이 겹친다.","학교 업무나 다른 일로 인해 시간이 부족하다.","나에게 적합한 전문성 학습 활동이 없다.","물리적 거리 때문에 참여하기 어렵다. (농촌·소규모 학교 맥락)","전문성 학습 참여에 따른 인센티브나 지원이 없다."]};
const SECS=[SA,SB,SC,SD];
const START=[1,19,24,32];
const CM={info:{bg:"var(--color-background-info)",tx:"var(--color-text-info)",br:"var(--color-border-info)"},success:{bg:"var(--color-background-success)",tx:"var(--color-text-success)",br:"var(--color-border-success)"},warning:{bg:"var(--color-background-warning)",tx:"var(--color-text-warning)",br:"var(--color-border-warning)"},danger:{bg:"var(--color-background-danger)",tx:"var(--color-text-danger)",br:"#f09595"}};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// ── API 통신 ─────────────────────────────────────────────────────────────
async function apiSave(data){
  const res=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"save",data})});
  return res.json();
}
async function apiLoad(password){
  const url=APPS_SCRIPT_URL+"?action=load&password="+encodeURIComponent(password);
  const res=await fetch(url);
  return res.json();
}

// ── 메인 앱 ──────────────────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState("survey");
  const [step,setStep]=useState(0);
  const [info,setInfo]=useState({name:"",career:"",grade:"",timing:""});
  const [resp,setResp]=useState({});
  const [free,setFree]=useState({q39:"",q40:""});
  const [saving,setSaving]=useState(false);
  const [saveErr,setSaveErr]=useState("");
  const [adminData,setAdminData]=useState([]);

  const curSec=step>=1&&step<=4?SECS[step-1]:null;
  function secDone(s){return s.items.every((_,i)=>resp[s.id+"_"+i]!==undefined);}
  function stepOk(){if(step===0)return info.timing!=="";if(step>=1&&step<=4)return secDone(SECS[step-1]);return true;}
  function setR(sid,idx,val){setResp(p=>({...p,[sid+"_"+idx]:val}));}

  async function submit(){
    if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.includes("여기에")){setSaveErr("⚠️ Apps Script URL이 설정되지 않았습니다. HTML 파일 상단의 APPS_SCRIPT_URL을 설정해 주세요.");return;}
    setSaving(true);setSaveErr("");
    const payload={id:uid(),submittedAt:new Date().toISOString(),info,responses:resp,freeText:free};
    try{
      const result=await apiSave(payload);
      if(result.ok){setStep(6);}
      else{setSaveErr("저장 실패: "+result.message);}
    }catch(err){setSaveErr("서버 연결 실패: "+err.message);}
    setSaving(false);
  }

  async function openAdmin(){
    const code=prompt("관리자 코드를 입력하세요:");
    if(!code)return;
    if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.includes("여기에")){alert("Apps Script URL이 설정되지 않았습니다.");return;}
    try{
      const result=await apiLoad(code);
      if(result.ok){setAdminData(result.data||[]);setPage("admin");}
      else{alert(result.message||"불러오기 실패");}
    }catch(err){alert("서버 연결 실패: "+err.message);}
  }

  function resetSurvey(){setStep(0);setResp({});setFree({q39:"",q40:""});setInfo({name:"",career:"",grade:"",timing:""});setSaveErr("");}

  if(page==="admin")return e(AdminView,{data:adminData,onBack:()=>setPage("survey"),onReload:()=>openAdmin()});

  const pct=Math.round((step/6)*100);
  const stepLabels=["기본 정보","섹션 A","섹션 B","섹션 C","섹션 D","서술형","완료"];

  if(step===6)return e("div",{style:{maxWidth:560,margin:"0 auto",padding:"3rem 1rem",textAlign:"center"}},
    e("div",{style:{width:72,height:72,borderRadius:"50%",background:"var(--color-background-success)",color:"var(--color-text-success)",fontSize:36,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 1.25rem"}},"✓"),
    e("h2",{style:{fontSize:20,fontWeight:500,marginBottom:8}},"응답이 구글 시트에 저장되었습니다"),
    e("p",{style:{fontSize:13,color:"var(--color-text-secondary)",lineHeight:1.8,marginBottom:"1.5rem"}},"소중한 응답 감사합니다.",e("br"),"결과는 연구 목적으로만 활용되며 개인 정보는 익명으로 처리됩니다."),
    e("button",{onClick:resetSurvey,style:{padding:"10px 24px",borderRadius:8,border:"0.5px solid var(--color-border-tertiary)",background:"var(--color-background-secondary)",cursor:"pointer",fontSize:13,color:"var(--color-text-secondary)"}},"처음으로")
  );

  return e("div",{style:{maxWidth:700,margin:"0 auto",padding:"1rem 0 4rem"}},
    e("div",{style:{marginBottom:"1.25rem"}},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}},
        e("div",null,
          e("div",{style:{fontSize:15,fontWeight:500}},"교사 효능감 및 전문성 학습 자기진단"),
          e("div",{style:{fontSize:11,color:"var(--color-text-secondary)"}},"장흥초등학교 · 2026학년도 연구학교 · TALIS 2024 기반 · 구글 시트 연동")
        ),
        e("button",{onClick:openAdmin,style:{fontSize:11,padding:"4px 10px",border:"0.5px solid var(--color-border-tertiary)",borderRadius:6,background:"transparent",cursor:"pointer",color:"var(--color-text-secondary)"}},"관리자")
      ),
      e("div",{style:{height:4,background:"var(--color-border-tertiary)",borderRadius:2}},
        e("div",{style:{height:4,width:pct+"%",background:"var(--color-text-info)",borderRadius:2,transition:"width .3s"}})
      ),
      e("div",{style:{display:"flex",justifyContent:"space-between",marginTop:4}},
        stepLabels.map((l,i)=>e("span",{key:i,style:{fontSize:10,color:i===step?"var(--color-text-info)":i<step?"var(--color-text-success)":"var(--color-text-secondary)",fontWeight:i===step?500:400}},l))
      )
    ),
    step===0&&e(BasicInfo,{info,setInfo}),
    step>=1&&step<=4&&curSec&&e(SectionQ,{sec:curSec,resp,setR,startNum:START[step-1]}),
    step===5&&e(FreeQ,{free,setFree,timing:info.timing}),
    saveErr&&e("div",{style:{marginTop:"1rem",padding:"10px 14px",background:"var(--color-background-danger)",borderRadius:8,fontSize:13,color:"var(--color-text-danger)",border:"0.5px solid #f09595"}},saveErr),
    e("div",{style:{display:"flex",gap:8,marginTop:"1.5rem"}},
      step>0&&e("button",{onClick:()=>setStep(s=>s-1),style:{flex:1,padding:11,fontSize:13,background:"var(--color-background-secondary)",color:"var(--color-text-secondary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:8,cursor:"pointer"}},"← 이전"),
      step<5&&e("button",{onClick:()=>setStep(s=>s+1),disabled:!stepOk(),style:{flex:2,padding:11,fontSize:14,fontWeight:500,background:stepOk()?"var(--color-background-info)":"var(--color-background-secondary)",color:stepOk()?"var(--color-text-info)":"var(--color-text-secondary)",border:"none",borderRadius:8,cursor:stepOk()?"pointer":"not-allowed",opacity:stepOk()?1:0.5}},"다음 →"),
      step===5&&e("button",{onClick:submit,disabled:saving,style:{flex:2,padding:11,fontSize:14,fontWeight:500,background:"var(--color-background-success)",color:"var(--color-text-success)",border:"none",borderRadius:8,cursor:saving?"not-allowed":"pointer",opacity:saving?0.6:1}},saving?"구글 시트에 저장 중...":"최종 제출 ✓")
    ),
    step>=1&&step<=4&&curSec&&e("div",{style:{textAlign:"right",fontSize:11,color:"var(--color-text-secondary)",marginTop:6}},
      curSec.items.filter((_,i)=>resp[curSec.id+"_"+i]!==undefined).length+"/"+curSec.items.length+" 항목 응답됨"
    )
  );
}

function BasicInfo({info,setInfo}){
  const c=CM.info;
  return e("div",null,
    e("div",{style:{borderBottom:"2px solid "+c.br,paddingBottom:"0.75rem",marginBottom:"1rem"}},
      e("div",{style:{fontSize:16,fontWeight:500}},"기본 정보"),
      e("div",{style:{fontSize:12,color:c.tx}},"응답 시작 전 아래 정보를 입력해 주세요")
    ),
    e("div",{style:{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:12,padding:"1.25rem",display:"flex",flexDirection:"column",gap:16}},
      e("div",null,
        e("label",{style:{display:"block",fontSize:12,fontWeight:500,color:"var(--color-text-secondary)",marginBottom:5}},"성명 (익명 가능)"),
        e("input",{value:info.name,onChange:ev=>setInfo(p=>({...p,name:ev.target.value})),placeholder:"홍길동 또는 익명",style:{width:"100%",fontSize:13,padding:"9px 10px",borderRadius:6,border:"0.5px solid var(--color-border-tertiary)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)"}})
      ),
      e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        e("div",null,
          e("label",{style:{display:"block",fontSize:12,fontWeight:500,color:"var(--color-text-secondary)",marginBottom:5}},"교직 경력 (년)"),
          e("input",{type:"number",min:0,max:50,value:info.career,onChange:ev=>setInfo(p=>({...p,career:ev.target.value})),placeholder:"예: 7",style:{width:"100%",fontSize:13,padding:"9px 10px",borderRadius:6,border:"0.5px solid var(--color-border-tertiary)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)"}})
        ),
        e("div",null,
          e("label",{style:{display:"block",fontSize:12,fontWeight:500,color:"var(--color-text-secondary)",marginBottom:5}},"담당 학년"),
          e("select",{value:info.grade,onChange:ev=>setInfo(p=>({...p,grade:ev.target.value})),style:{width:"100%",fontSize:13,padding:"9px 10px",borderRadius:6,border:"0.5px solid var(--color-border-tertiary)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)"}},
            e("option",{value:""},"선택"),
            ["1학년","2학년","3학년","4학년","5학년","6학년","복식","전담"].map(g=>e("option",{key:g,value:g},g))
          )
        )
      ),
      e("div",null,
        e("label",{style:{display:"block",fontSize:12,fontWeight:500,color:"var(--color-text-secondary)",marginBottom:5}},"참여 구분 *"),
        e("div",{style:{display:"flex",gap:8}},
          [["pre","사전 조사 (3월)"],["post","사후 조사 (10월)"]].map(([val,label])=>
            e("button",{key:val,onClick:()=>setInfo(p=>({...p,timing:val})),style:{flex:1,padding:"11px 0",fontSize:13,borderRadius:8,border:"0.5px solid "+(info.timing===val?c.br:"var(--color-border-tertiary)"),background:info.timing===val?c.bg:"var(--color-background-secondary)",color:info.timing===val?c.tx:"var(--color-text-secondary)",cursor:"pointer",fontWeight:info.timing===val?500:400}},label)
          )
        )
      ),
      e("div",{style:{fontSize:11,color:"var(--color-text-secondary)",lineHeight:1.6,padding:"8px 10px",background:"var(--color-background-secondary)",borderRadius:6}},
        "※ 이 설문은 연구 목적으로만 사용되며 개인 정보는 익명으로 처리됩니다. 성명 입력은 선택사항입니다."
      )
    )
  );
}

function SectionQ({sec,resp,setR,startNum}){
  const c=CM[sec.col];
  return e("div",null,
    e("div",{style:{borderBottom:"2px solid "+c.br,paddingBottom:"0.75rem",marginBottom:"0.75rem"}},
      e("div",{style:{fontSize:16,fontWeight:500}},"섹션 "+sec.id+". "+sec.title),
      e("div",{style:{fontSize:12,color:c.tx}},sec.sub+" | "+sec.items.length+"문항")
    ),
    e("div",{style:{fontSize:12,color:"var(--color-text-secondary)",marginBottom:"0.75rem",lineHeight:1.6}},sec.inst),
    e("div",{style:{display:"grid",gridTemplateColumns:"1fr repeat(4,56px)",gap:4,marginBottom:6,paddingRight:4}},
      e("div"),

// ── 관리자 화면 ──────────────────────────────────────────────────────────
function AdminView({data,onBack,onReload}){
  const [view,setView]=useState("summary");
  const [loading,setLoading]=useState(false);

  async function reload(){
    setLoading(true);
    await onReload();
    setLoading(false);
  }

  function secAvg(responses,secId,count){
    const vals=Array.from({length:count},(_,i)=>responses[secId+"_"+i]).filter(v=>v!==undefined);
    if(!vals.length)return null;
    return(vals.reduce((a,b)=>a+b,0)/vals.length+1).toFixed(2);
  }
  const preD=data.filter(d=>d.info?.timing==="pre");
  const postD=data.filter(d=>d.info?.timing==="post");
  function gAvg(group,sid,cnt){
    const avgs=group.map(d=>secAvg(d.responses,sid,cnt)).filter(Boolean).map(Number);
    if(!avgs.length)return"-";
    return(avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(2);
  }

  function dlCSV(){
    const hdrs=["ID","제출일시","성명","경력","학년","구분",...SA.items.map((_,i)=>"A"+(i+1)),...SB.items.map((_,i)=>"B"+(i+1)),...SC.items.map((_,i)=>"C"+(i+1)),...SD.items.map((_,i)=>"D"+(i+1)),"자유39","자유40"];
    const rows=data.map(d=>[d.id,d.submittedAt,d.info?.name||"",d.info?.career||"",d.info?.grade||"",d.info?.timing||"",...SA.items.map((_,i)=>d.responses?.["A_"+i]!==undefined?d.responses["A_"+i]+1:""),...SB.items.map((_,i)=>d.responses?.["B_"+i]!==undefined?d.responses["B_"+i]+1:""),...SC.items.map((_,i)=>d.responses?.["C_"+i]!==undefined?d.responses["C_"+i]+1:""),...SD.items.map((_,i)=>d.responses?.["D_"+i]!==undefined?d.responses["D_"+i]+1:""),'"'+(d.freeText?.q39||"").replace(/"/g,'""')+'"','"'+(d.freeText?.q40||"").replace(/"/g,'""')+'"']);
    const csv=[hdrs.join(","),...rows.map(r=>r.join(","))].join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="장흥초_효능감설문_결과.csv";a.click();
  }

  return e("div",{style:{maxWidth:760,margin:"0 auto",padding:"1rem 0 4rem"}},
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.25rem",paddingBottom:"0.75rem",borderBottom:"2px solid var(--color-border-info)"}},
      e("div",null,
        e("div",{style:{fontSize:16,fontWeight:500}},"관리자 — 구글 시트 연동 응답 현황"),
        e("div",{style:{fontSize:12,color:"var(--color-text-secondary)"}},"전체 "+data.length+"건 (사전 "+preD.length+" / 사후 "+postD.length+")")
      ),
      e("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
        e("button",{onClick:reload,disabled:loading,style:{fontSize:12,padding:"6px 12px",borderRadius:6,border:"0.5px solid var(--color-border-info)",background:"var(--color-background-info)",color:"var(--color-text-info)",cursor:"pointer"}},loading?"로드 중...":"새로고침"),
        e("button",{onClick:dlCSV,style:{fontSize:12,padding:"6px 12px",borderRadius:6,border:"0.5px solid var(--color-border-success)",background:"var(--color-background-success)",color:"var(--color-text-success)",cursor:"pointer"}},"CSV 다운로드"),
        e("button",{onClick:onBack,style:{fontSize:12,padding:"6px 12px",borderRadius:6,border:"0.5px solid var(--color-border-tertiary)",background:"var(--color-background-secondary)",color:"var(--color-text-secondary)",cursor:"pointer"}},"← 설문으로")
      )
    ),
    e("div",{style:{display:"flex",gap:4,marginBottom:"1rem"}},
      [["summary","요약"],["individual","개별 응답"],["items","문항별 평균"]].map(([v,l])=>
        e("button",{key:v,onClick:()=>setView(v),style:{padding:"7px 14px",fontSize:12,borderRadius:6,border:"0.5px solid var(--color-border-tertiary)",background:view===v?"var(--color-background-info)":"var(--color-background-secondary)",color:view===v?"var(--color-text-info)":"var(--color-text-secondary)",cursor:"pointer"}},l)
      )
    ),
    view==="summary"&&e("div",null,
      e("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:"1.25rem"}},
        [["전체",data.length+"건","info"],["사전",preD.length+"건","success"],["사후",postD.length+"건","warning"],["미분류",data.filter(d=>!d.info?.timing).length+"건","danger"]].map(([l,v,col])=>{
          const c=CM[col];
          return e("div",{key:l,style:{background:c.bg,borderRadius:10,padding:"12px",textAlign:"center"}},e("div",{style:{fontSize:22,fontWeight:500,color:c.tx}},v),e("div",{style:{fontSize:11,color:c.tx}},l));
        })
      ),
      e("div",{style:{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:10,overflow:"hidden"}},
        e("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:13}},
          e("thead",null,e("tr",{style:{background:"var(--color-background-secondary)"}},
            ["섹션","내용","사전 평균","사후 평균"].map(h=>e("th",{key:h,style:{padding:"10px 12px",textAlign:"center",fontWeight:500,color:"var(--color-text-secondary)",fontSize:12,borderBottom:"0.5px solid var(--color-border-tertiary)"}},h))
          )),
          e("tbody",null,
            [["A","교수 활동 전반 효능감",18],["B","정서 지원 효능감",5],["C","전문성 학습 필요 영역",8],["D","참여 방해 요인",7]].map(([id,name,cnt])=>
              e("tr",{key:id,style:{borderBottom:"0.5px solid var(--color-border-tertiary)"}},
                e("td",{style:{padding:"10px 12px",textAlign:"center",fontWeight:500,color:"var(--color-text-info)"}},id),
                e("td",{style:{padding:"10px 12px"}},name),
                e("td",{style:{padding:"10px 12px",textAlign:"center",color:"var(--color-text-success)",fontWeight:500}},gAvg(preD,id,cnt)),
                e("td",{style:{padding:"10px 12px",textAlign:"center",color:"var(--color-text-warning)",fontWeight:500}},gAvg(postD,id,cnt))
              )
            )
          )
        )
      ),
      e("div",{style:{fontSize:11,color:"var(--color-text-secondary)",marginTop:8}},"※ 평균은 1~4점 척도 기준입니다. 구글 시트에서도 실시간 확인 가능합니다.")
    ),
    view==="individual"&&e("div",{style:{display:"flex",flexDirection:"column",gap:10}},
      data.length===0&&e("div",{style:{textAlign:"center",padding:"2rem",color:"var(--color-text-secondary)",fontSize:13}},"아직 응답이 없습니다."),
      [...data].sort((a,b)=>new Date(b.submittedAt||0)-new Date(a.submittedAt||0)).map(d=>
        e("div",{key:d.id,style:{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:10,padding:"1rem"}},
          e("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:8}},
            e("div",null,e("span",{style:{fontWeight:500,fontSize:13}},d.info?.name||"익명"),e("span",{style:{fontSize:12,color:"var(--color-text-secondary)",marginLeft:8}},"경력 "+(d.info?.career||"?")+"년 · "+(d.info?.grade||"?"))),
            e("div",{style:{display:"flex",gap:6,alignItems:"center"}},
              e("span",{style:{fontSize:11,padding:"2px 8px",borderRadius:999,background:d.info?.timing==="pre"?"var(--color-background-success)":"var(--color-background-warning)",color:d.info?.timing==="pre"?"var(--color-text-success)":"var(--color-text-warning)"}},d.info?.timing==="pre"?"사전":"사후"),
              e("span",{style:{fontSize:11,color:"var(--color-text-secondary)"}},d.submittedAt?new Date(d.submittedAt).toLocaleDateString("ko-KR"):"")
            )
          ),
          e("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}},
            [["A",18,"info"],["B",5,"success"],["C",8,"warning"],["D",7,"danger"]].map(([id,cnt,col])=>{
              const avg=secAvg(d.responses,id,cnt);const c=CM[col];
              return e("div",{key:id,style:{background:c.bg,borderRadius:6,padding:"8px",textAlign:"center"}},e("div",{style:{fontSize:10,color:c.tx}},"섹션 "+id),e("div",{style:{fontSize:20,fontWeight:500,color:c.tx}},avg||"-"));
            })
          ),
          (d.freeText?.q39||d.freeText?.q40)&&e("div",{style:{marginTop:10,padding:"8px 10px",background:"var(--color-background-secondary)",borderRadius:6,fontSize:12,color:"var(--color-text-secondary)",lineHeight:1.65}},
            d.freeText?.q39&&e("div",null,e("b",null,"강점: "),d.freeText.q39),
            d.freeText?.q40&&e("div",{style:{marginTop:d.freeText?.q39?4:0}},e("b",null,"성장 목표: "),d.freeText.q40)
          )
        )
      )
    ),
    view==="items"&&e("div",null,
      [SA,SB,SC,SD].map(sec=>{
        const c=CM[sec.col];
        return e("div",{key:sec.id,style:{marginBottom:"1.5rem"}},
          e("div",{style:{fontSize:13,fontWeight:500,color:c.tx,marginBottom:8,padding:"6px 10px",background:c.bg,borderRadius:6}},"섹션 "+sec.id+" — "+sec.title),
          e("div",{style:{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:10,overflow:"hidden"}},
            e("div",{style:{display:"grid",gridTemplateColumns:"1fr 72px 72px 72px",padding:"6px 12px 4px",borderBottom:"0.5px solid var(--color-border-tertiary)"}},
              e("div",{style:{fontSize:10,color:"var(--color-text-secondary)"}},"문항"),
              e("div",{style:{textAlign:"center",fontSize:10,color:"var(--color-text-success)"}},"사전"),
              e("div",{style:{textAlign:"center",fontSize:10,color:"var(--color-text-warning)"}},"사후"),
              e("div",{style:{textAlign:"center",fontSize:10,color:"var(--color-text-secondary)"}},"변화")
            ),
            sec.items.map((item,idx)=>{
              const pv=preD.map(d=>d.responses?.[sec.id+"_"+idx]).filter(v=>v!==undefined).map(v=>v+1);
              const qv=postD.map(d=>d.responses?.[sec.id+"_"+idx]).filter(v=>v!==undefined).map(v=>v+1);
              const pa=pv.length?(pv.reduce((a,b)=>a+b,0)/pv.length).toFixed(2):"-";
              const qa=qv.length?(qv.reduce((a,b)=>a+b,0)/qv.length).toFixed(2):"-";
              const diff=(pa!=="-"&&qa!=="-")?(Number(qa)-Number(pa)).toFixed(2):"-";
              return e("div",{key:idx,style:{display:"grid",gridTemplateColumns:"1fr 72px 72px 72px",padding:"8px 12px",borderBottom:"0.5px solid var(--color-border-tertiary)",background:idx%2===0?"transparent":"var(--color-background-secondary)",alignItems:"center"}},
                e("div",{style:{fontSize:12,lineHeight:1.5}},e("span",{style:{color:"var(--color-text-secondary)",marginRight:4,fontSize:11}},idx+1+"."),item),
                e("div",{style:{textAlign:"center",fontSize:13,color:"var(--color-text-success)",fontWeight:500}},pa),
                e("div",{style:{textAlign:"center",fontSize:13,color:"var(--color-text-warning)",fontWeight:500}},qa),
                e("div",{style:{textAlign:"center",fontSize:12,fontWeight:500,color:diff!=="-"&&Number(diff)>0?"var(--color-text-success)":diff!=="-"&&Number(diff)<0?"var(--color-text-danger)":"var(--color-text-secondary)"}},diff!=="-"?(Number(diff)>0?"+":"")+diff:"-")
              );
            })
          )
        );
      })
    )
  );
}
