<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사 효능감 자기진단 | 장흥초 2026</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#efede8;--bgi:#e6f1fb;--bgs:#eaf3de;--bgw:#faeeda;--bgd:#fcebeb;--tx:#1a1a18;--tx2:#5f5e5a;--txi:#185fa5;--txs:#3b6d11;--txw:#854f0b;--txd:#a32d2d;--bri:rgba(0,0,0,.12);--br2:rgba(0,0,0,.22);--brci:#378add;--brcs:#639922;--brcw:#ba7517;--f:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e1c;--bg2:#2a2a27;--bg3:#333330;--bgi:#0c447c;--bgs:#27500a;--bgw:#633806;--bgd:#791f1f;--tx:#f0ede8;--tx2:#b4b2a9;--txi:#85b7eb;--txs:#c0dd97;--txw:#fac775;--txd:#f09595;--bri:rgba(255,255,255,.12);--br2:rgba(255,255,255,.22);--brci:#85b7eb;--brcs:#c0dd97;--brcw:#fac775}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg3);min-height:100vh;padding:1.5rem 1rem 5rem;color:var(--tx)}
input,select,textarea,button{font-family:var(--f)}
@keyframes bn{0%,80%,100%{transform:scale(.6)}40%{transform:scale(1)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const GW = "https://script.google.com/macros/s/AKfycbz5cVIcB4So3OQiNcNljRdHQYklBVTMDr0_YSZf0LQoWY8issP2fWBJ7XxDzlhf0gVb/exec";

const SA={id:"A",col:"i",title:"교수 활동 전반 효능감",sub:"TALIS 2024 TQ_27",
  sc:["1\n낮은\n수준","2\n보통\n수준","3\n높은\n수준","4\n매우 높은\n수준"],
  it:["나는 학생들이 어려운 과제를 해결하도록 다양한 방법으로 도울 수 있다.","나는 학생들에게 수업 내용에 대한 대안적인 설명을 제공할 수 있다.","나는 수업을 방해하는 학생들을 적절히 지도하여 수업 흐름을 유지할 수 있다.","나는 학생들이 비판적으로 사고하도록 돕는 질문을 만들어 낼 수 있다.","나는 학생들이 수업에 가치를 부여하도록 동기를 부여할 수 있다.","나는 다양한 학생 수준에 맞게 수업을 조정하는 능력이 있다.","나는 어려운 학생들을 이해하도록 돕는 좋은 전략을 알고 있다.","나는 학생들이 나의 수업 기대치를 명확히 이해하도록 할 수 있다.","나는 학급에서 방해가 되는 행동을 미리 예방하거나 최소화할 수 있다.","나는 학생들이 학습에 적극적으로 참여하도록 유도할 수 있다.","나는 수업 목표를 달성할 수 있는 다양한 교수 방법을 구사할 수 있다.","나는 학생들이 학습한 내용을 일상생활과 연결하도록 도울 수 있다.","나는 학교 정책과 학생의 요구 사이에 균형을 유지할 수 있다.","나는 어려운 학생들을 위해 적절한 도전 활동을 제공할 수 있다.","나는 학생들이 수업 중 자신의 이해 정도를 점검하도록 도울 수 있다.","나는 학생들의 개별적인 학습 필요를 수업에서 적절히 반영할 수 있다.","나는 모든 학생이 성장하도록 도울 수 있다.","나는 학생들 간의 성취 격차를 줄이도록 지원할 수 있다."]};
const SB={id:"B",col:"s",title:"정서 지원 효능감",sub:"TALIS 2024 TQ_61·62",
  sc:["1\n낮은\n수준","2\n보통\n수준","3\n높은\n수준","4\n매우 높은\n수준"],
  it:["나는 학생들이 정서적 어려움을 겪을 때 적절히 지원할 수 있다.","나는 학생들이 학교생활에서 소속감을 느끼도록 도울 수 있다.","나는 학생 간 갈등이 발생했을 때 효과적으로 중재할 수 있다.","나는 학생들의 사회적·정서적 발달에 긍정적인 영향을 미칠 수 있다.","나는 학급 내 심리적으로 안전한 분위기를 형성할 수 있다."]};
const SC={id:"C",col:"w",title:"전문성 학습 필요 영역",sub:"TALIS 2024 TQ_24",
  sc:["현재\n필요 없음","약간\n필요함","어느 정도\n필요함","매우 많이\n필요함"],
  it:["학생 평가의 실제 (과정 중심 평가, 형성평가 등)","개별화 학습 방법 (수준별 수업, 학생 맞춤 지원 등)","학생의 사회정서적 학습 지원 방법","학급에서의 학생 행동 관리 및 생활지도","학생 평가 결과의 분석 및 수업 개선 연계","디지털 도구와 자료를 활용한 교수법","교수학습 활동에서의 인공지능(AI) 활용","교사와 학부모(보호자) 간 협력 방법"]};
const SD={id:"D",col:"d",title:"전문성 학습 참여 방해 요인",sub:"TALIS 2024 TQ_25",
  sc:["전혀\n동의 안 함","동의\n안 함","동의함","매우\n동의함"],
  it:["비용이 너무 많이 든다.","학교 차원의 지원이 부족하다.","전문성 학습 활동과 업무 일정이 겹친다.","학교 업무나 다른 일로 인해 시간이 부족하다.","나에게 적합한 전문성 학습 활동이 없다.","물리적 거리 때문에 참여하기 어렵다. (농촌·소규모 학교 맥락)","전문성 학습 참여에 따른 인센티브나 지원이 없다."]};
const SECS=[SA,SB,SC,SD];
const ST=[1,19,24,32];
const CM={i:{bg:"var(--bgi)",tx:"var(--txi)",br:"var(--brci)"},s:{bg:"var(--bgs)",tx:"var(--txs)",br:"var(--brcs)"},w:{bg:"var(--bgw)",tx:"var(--txw)",br:"var(--brcw)"},d:{bg:"var(--bgd)",tx:"var(--txd)",br:"#f09595"}};

var S={step:0,info:{name:"",career:"",grade:"",timing:""},resp:{},free:{q39:"",q40:""},saving:false,err:"",aiLoad:false,aiTxt:null,savedInfo:null,aData:[],anData:[],aView:"sum",selAI:null,page:"survey"};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function e(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// 자동저장
function save(){try{localStorage.setItem("jh_draft",JSON.stringify({step:S.step,info:S.info,resp:S.resp,free:S.free}));}catch(x){}}
function load(){try{var d=JSON.parse(localStorage.getItem("jh_draft")||"null");if(d&&d.step>0){S.step=d.step;S.info=Object.assign(S.info,d.info||{});S.resp=d.resp||{};S.free=d.free||{q39:"",q40:""};}return d&&d.step>0;}catch(x){return false;}}
function clear(){try{localStorage.removeItem("jh_draft");}catch(x){}}

function render(){document.getElementById("app").innerHTML=S.page==="admin"?rAdmin():S.step===6?rResult():rSurvey();}

async function api(body){var r=await fetch(GW,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)});return r.json();}
async function apiG(p){var q=Object.keys(p).map(function(k){return k+"="+encodeURIComponent(p[k]);}).join("&");var r=await fetch(GW+"?"+q);return r.json();}

// ── 설문 ────────────────────────────────────────────────────────
function rSurvey(){
  var pct=Math.round(S.step/6*100);
  var lb=["기본정보","섹션A","섹션B","섹션C","섹션D","서술형","AI분석"];
  var ok=sOk();
  var h='<div style="max-width:700px;margin:0 auto;padding:1rem 0 4rem">';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">';
  h+='<div><div style="font-size:15px;font-weight:500;color:var(--tx)">교사 효능감 및 전문성 학습 자기진단</div>';
  h+='<div style="font-size:11px;color:var(--tx2)">장흥초등학교 · 2026학년도 연구학교 · TALIS 2024 기반</div></div>';
  h+='<button onclick="openAdmin()" style="font-size:11px;padding:4px 10px;border:0.5px solid var(--bri);border-radius:6px;background:transparent;cursor:pointer;color:var(--tx2)">관리자</button></div>';
  h+='<div style="height:4px;background:var(--bri);border-radius:2px;margin-bottom:4px"><div style="height:4px;width:'+pct+'%;background:var(--txi);border-radius:2px;transition:width .3s"></div></div>';
  h+='<div style="display:flex;justify-content:space-between;margin-bottom:1.25rem">';
  for(var i=0;i<lb.length;i++){
    var canGo=(i<S.step)||(i===S.step)||(i===S.step+1&&sOk()&&i<=5);
    h+='<button onclick="goStep('+i+')" '+(canGo?"":"disabled")+' style="font-size:10px;color:'+(i===S.step?"var(--txi)":i<S.step?"var(--txs)":"var(--tx2)")+';background:none;border:none;cursor:'+(canGo?"pointer":"default")+';padding:2px 4px;border-radius:4px;font-weight:'+(i===S.step?600:400)+';text-decoration:'+(i<S.step?"underline":"none")+'">'+lb[i]+'</button>';
  }
  h+='</div>';
  if(S.step===0)h+=rBasic();
  else if(S.step>=1&&S.step<=4)h+=rSec(SECS[S.step-1],ST[S.step-1]);
  else if(S.step===5)h+=rFree();
  if(S.err)h+='<div style="margin-top:1rem;padding:10px 14px;background:var(--bgd);border-radius:8px;font-size:13px;color:var(--txd)">'+e(S.err)+'</div>';
  h+='<div style="display:flex;gap:8px;margin-top:1.5rem">';
  if(S.step>0)h+='<button onclick="prev()" style="flex:1;padding:11px;font-size:13px;background:var(--bg2);color:var(--tx2);border:0.5px solid var(--bri);border-radius:8px;cursor:pointer">← 이전</button>';
  if(S.step<5)h+='<button onclick="next()" '+(ok?"":"disabled")+' style="flex:2;padding:11px;font-size:14px;font-weight:500;background:'+(ok?"var(--bgi)":"var(--bg2)")+';color:'+(ok?"var(--txi)":"var(--tx2)")+';border:none;border-radius:8px;cursor:'+(ok?"pointer":"not-allowed")+';opacity:'+(ok?1:.5)+'">다음 →</button>';
  if(S.step===5)h+='<button onclick="submit()" '+(S.saving?"disabled":"")+' style="flex:2;padding:11px;font-size:14px;font-weight:500;background:var(--bgs);color:var(--txs);border:none;border-radius:8px;cursor:'+(S.saving?"not-allowed":"pointer")+';opacity:'+(S.saving?.6:1)+'">'+( S.saving?"저장 중...":"최종 제출 ✓")+'</button>';
  h+='</div>';
  if(S.step>=1&&S.step<=4){var sec=SECS[S.step-1];var dn=sec.it.filter(function(_,i){return S.resp[sec.id+"_"+i]!==undefined;}).length;h+='<div style="text-align:right;font-size:11px;color:var(--tx2);margin-top:6px">'+dn+'/'+sec.it.length+' 항목 응답됨</div>';}
  h+='</div>';
  return h;
}

function rBasic(){
  var c=CM.i;
  var h='<div style="border-bottom:2px solid '+c.br+';padding-bottom:.75rem;margin-bottom:1rem"><div style="font-size:16px;font-weight:500">기본 정보</div><div style="font-size:12px;color:'+c.tx+'">응답 시작 전 아래 정보를 입력해 주세요</div></div>';
  h+='<div style="background:var(--bg);border:0.5px solid var(--bri);border-radius:12px;padding:1.25rem;display:flex;flex-direction:column;gap:16px">';
  h+='<div><label style="display:block;font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:5px">성명 (익명 가능)</label>';
  h+='<input value="'+e(S.info.name)+'" oninput="S.info.name=this.value;save()" placeholder="홍길동 또는 익명" style="width:100%;font-size:13px;padding:9px 10px;border-radius:6px;border:0.5px solid var(--bri);background:var(--bg2);color:var(--tx)"></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  h+='<div><label style="display:block;font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:5px">교직 경력 (년)</label>';
  h+='<input type="number" min="0" max="50" value="'+e(S.info.career)+'" oninput="S.info.career=this.value;save()" placeholder="예: 7" style="width:100%;font-size:13px;padding:9px 10px;border-radius:6px;border:0.5px solid var(--bri);background:var(--bg2);color:var(--tx)"></div>';
  h+='<div><label style="display:block;font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:5px">담당 학년</label>';
  h+='<select onchange="S.info.grade=this.value;save()" style="width:100%;font-size:13px;padding:9px 10px;border-radius:6px;border:0.5px solid var(--bri);background:var(--bg2);color:var(--tx)"><option value="">선택</option>';
  ["1학년","2학년","3학년","4학년","5학년","6학년","복식","전담"].forEach(function(g){h+='<option value="'+g+'"'+(S.info.grade===g?" selected":"")+'>'+g+'</option>';});
  h+='</select></div></div>';
  h+='<div><label style="display:block;font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:5px">참여 구분 *</label><div style="display:flex;gap:8px">';
  [["pre","사전 조사 (3월)"],["post","사후 조사 (10월)"]].forEach(function(p){
    var sel=S.info.timing===p[0];
    h+='<button onclick="S.info.timing=\''+p[0]+'\';save();render()" style="flex:1;padding:11px 0;font-size:13px;border-radius:8px;border:0.5px solid '+(sel?c.br:"var(--bri)")+';background:'+(sel?c.bg:"var(--bg2)")+';color:'+(sel?c.tx:"var(--tx2)")+';cursor:pointer;font-weight:'+(sel?500:400)+'">'+p[1]+'</button>';
  });
  h+='</div></div>';
  h+='<div style="font-size:11px;color:var(--tx2);line-height:1.6;padding:8px 10px;background:var(--bg2);border-radius:6px">※ 이 설문은 연구 목적으로만 사용되며 개인 정보는 익명으로 처리됩니다.</div>';
  h+='</div>';
  return h;
}

function rSec(sec,sn){
  var c=CM[sec.col];
  var h='<div style="border-bottom:2px solid '+c.br+';padding-bottom:.75rem;margin-bottom:.75rem"><div style="font-size:16px;font-weight:500">섹션 '+sec.id+'. '+sec.title+'</div><div style="font-size:12px;color:'+c.tx+'">'+sec.sub+' | '+sec.it.length+'문항</div></div>';
  h+='<div style="font-size:12px;color:var(--tx2);margin-bottom:.75rem;line-height:1.6">각 항목에 대해 현재 자신의 상태에 가장 가까운 것을 선택해 주세요.</div>';
  h+='<div style="display:grid;grid-template-columns:1fr repeat(4,56px);gap:4px;margin-bottom:6px"><div></div>';
  sec.sc.forEach(function(s){h+='<div style="font-size:10px;text-align:center;color:'+c.tx+';line-height:1.3;white-space:pre-line;background:'+c.bg+';border-radius:4px;padding:4px 2px">'+s+'</div>';});
  h+='</div><div style="display:flex;flex-direction:column;gap:5px">';
  sec.it.forEach(function(item,idx){
    var k=sec.id+"_"+idx,v=S.resp[k];
    h+='<div style="display:grid;grid-template-columns:1fr repeat(4,56px);gap:4px;align-items:center;background:'+(idx%2===0?"var(--bg)":"var(--bg2)")+';border-radius:8px;padding:9px 10px;border:0.5px solid '+(v!==undefined?c.br:"var(--bri)")+'">';
    h+='<div style="font-size:13px;line-height:1.55;padding-right:6px"><span style="color:var(--tx2);font-size:11px;margin-right:4px">'+(sn+idx)+'.</span>'+e(item)+'</div>';
    for(var sc=0;sc<4;sc++){var sel=v===sc;h+='<button onclick="setR(\''+k+'\','+sc+')" style="width:40px;height:40px;border-radius:50%;border:'+(sel?'2px solid '+c.br:'0.5px solid var(--br2)')+';background:'+(sel?c.bg:"var(--bg)")+';cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto"><div style="width:14px;height:14px;border-radius:50%;background:'+(sel?c.tx:"transparent")+';border:'+(sel?"none":"1.5px solid var(--br2)")+'"></div></button>';}
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function rFree(){
  var c=CM.i;
  var h='<div style="border-bottom:2px solid '+c.br+';padding-bottom:.75rem;margin-bottom:1rem"><div style="font-size:16px;font-weight:500">서술형 응답</div><div style="font-size:12px;color:'+c.tx+'">선택사항 · 솔직하게 서술해 주세요</div></div>';
  h+='<div style="display:flex;flex-direction:column;gap:14px">';
  [{k:"q39",n:39,q:"현재 가장 자신 있는 교수·생활지도 영역은 무엇인가요?"},{k:"q40",n:40,q:"올해 가장 성장하고 싶은 역량 영역과 그 이유를 써 주세요."}].forEach(function(item){
    h+='<div style="background:var(--bg);border:0.5px solid var(--bri);border-radius:12px;overflow:hidden"><div style="background:'+c.bg+';padding:10px 14px;font-size:13px;font-weight:500;color:'+c.tx+'">'+item.n+'. '+item.q+'</div>';
    h+='<textarea oninput="S.free.'+item.k+'=this.value;save()" placeholder="자유롭게 서술해 주세요..." style="width:100%;min-height:90px;padding:12px 14px;font-size:13px;border:none;background:transparent;color:var(--tx);resize:vertical;line-height:1.7;outline:none;font-family:var(--f)">'+e(S.free[item.k])+'</textarea></div>';
  });
  h+='<div style="font-size:11px;color:var(--tx2)">※ 모든 문항을 작성하셨다면 최종 제출 버튼을 눌러 주세요.</div></div>';
  return h;
}

// ── AI 결과 화면 ────────────────────────────────────────────────
function rResult(){
  var secs=parse(S.aiTxt||"");
  var cm={"종합 진단":"i","우선 성장 영역":"w","맞춤 추천 프로그램":"s","이달의 실천 과제":"d"};
  var scores=calcScores();
  var secDefs=[{id:"A",label:"교수 활동 전반\n효능감",col:"i",max:4},{id:"B",label:"정서 지원\n효능감",col:"s",max:4},{id:"C",label:"전문성 학습\n필요 영역",col:"w",max:4},{id:"D",label:"참여\n방해 요인",col:"d",max:4}];
  var h='<div style="max-width:720px;margin:0 auto;padding:1rem 0 4rem">';

  // 저장 완료 배너

  t+="## 기본 정보\n- 경력: "+info.career+"년 ("+cg+")\n- 학년: "+(info.grade||"?")+"\n- 시기: "+(info.timing==="pre"?"사전":"사후")+"\n\n";
  t+="## 설문 결과 (1=전혀/필요없음 ~ 4=아주/매우)\n\n### A. 교수 활동 전반 효능감\n";
  SA.it.forEach(function(q,i){var v=resp["A_"+i];t+=(i+1)+". "+q+" → "+(v!==undefined?v+1:"미응답")+"점\n";});
  t+="\n### B. 정서 지원 효능감\n";
  SB.it.forEach(function(q,i){var v=resp["B_"+i];t+=(i+1)+". "+q+" → "+(v!==undefined?v+1:"미응답")+"점\n";});
  t+="\n### C. 전문성 학습 필요 영역 (높을수록 학습 필요)\n";
  SC.it.forEach(function(q,i){var v=resp["C_"+i];t+=(i+1)+". "+q+" → "+(v!==undefined?v+1:"미응답")+"점\n";});
  t+="\n### D. 학습 참여 방해 요인 (높을수록 방해됨)\n";
  SD.it.forEach(function(q,i){var v=resp["D_"+i];t+=(i+1)+". "+q+" → "+(v!==undefined?v+1:"미응답")+"점\n";});
  if(free&&(free.q39||free.q40)){t+="\n## 서술형\n";if(free.q39)t+="- 강점: "+free.q39+"\n";if(free.q40)t+="- 성장 목표: "+free.q40+"\n";}
  t+="\n## 요청\n아래 4개 섹션을 반드시 【섹션명】 형식의 헤딩으로 구분하여 한국어로 작성해 주세요.\n반드시 【종합 진단】으로 시작하고, 【우선 성장 영역】, 【맞춤 추천 프로그램】, 【이달의 실천 과제】 순서로 작성하세요.\n\n【종합 진단】\n이 교사의 역량 프로파일을 2~3문단으로 서술 (경력 맥락 반영), 강점 2~3가지와 근거, 주의 깊게 살펴볼 영역 2~3가지\n\n【우선 성장 영역】\nA+B(낮은 효능감)와 C(높은 학습 필요)를 교차 분석하여 가장 우선 개발이 필요한 역량 3가지와 이유, D 방해 요인을 고려한 현실적 성장 경로\n\n【맞춤 추천 프로그램】\n우선 성장 영역별: 1)추천 연수(NTTP·에듀넷 등 실제 연수명) 2)추천 도서(저자·출판사 포함) 3)추천 활동(PLC·수업연구 등) 4)온라인 자료\n\n【이달의 실천 과제】\n지금 당장 시작할 수 있는 작은 실천 3가지 (구체적·실행 가능)\n\n격려와 성장 관점에서 실용적으로 작성해 주세요. 반드시 위 4개 【】 헤딩을 모두 포함하세요.";
  return t;
}

function parse(txt){
  if(!txt)return[];
  var parts=txt.split(/【([^】]+)】/),r=[];
  for(var i=1;i<parts.length;i+=2){var t=parts[i].trim(),b=(parts[i+1]||"").trim();if(t&&b)r.push({t:t,b:b});}
  if(!r.length&&txt.trim())r.push({t:"분석 결과",b:txt.trim()});
  return r;
}

function aDlPlan(){if(!S.selAI)return;var x=S.selAI;openPlan(makePlan({name:x.name,career:x.career,grade:x.grade,timing:x.timing==="사전(3월)"?"pre":"post"},parse(x.fullText||""),null));}

// ── 초기 실행 ───────────────────────────────────────────────────
var hadDraft=load();
render();
if(hadDraft){
  var nb=document.createElement("div");
  nb.style.cssText="position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--bgi);color:var(--txi);border:0.5px solid var(--brci);border-radius:10px;padding:12px 20px;font-size:13px;font-weight:500;z-index:999;box-shadow:0 2px 12px rgba(0,0,0,.15);white-space:nowrap";
  nb.innerHTML='이전에 작성하던 내용이 복원되었어요 ✓ &nbsp;<button onclick="this.parentNode.remove()" style="background:none;border:none;color:var(--txi);cursor:pointer;font-size:13px">확인</button>';
  document.body.appendChild(nb);
  setTimeout(function(){if(nb.parentNode)nb.remove();},4000);
}
</script>
</body>
</html>
